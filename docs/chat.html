<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlassesCat AI — Elythra-AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        ::selection { background: rgba(255,107,0,0.2); }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f8f7f4;
            color: #1f1f1f;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.06); border-radius: 2px; }

        .top { display: flex; align-items: center; justify-content: center; padding: 8px 20px 0; }
        .top-inner { width: 100%; max-width: 768px; display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .brand img { width: 32px; height: 32px; border-radius: 50%; object-fit: contain; }
        .brand-text { font-weight: 700; font-size: 1rem; color: #1f1f1f; letter-spacing: -0.01em; }
        .brand-sub { font-size: 0.65rem; color: #888; margin-top: -1px; }
        .top-right { display: flex; align-items: center; gap: 8px; }
        .top-btn {
            height: 36px; padding: 0 14px; border-radius: 100px;
            border: 1px solid #e0dcd4; background: #fff;
            color: #444; cursor: pointer; font-size: 0.8rem;
            font-family: inherit; font-weight: 500;
            display: flex; align-items: center; gap: 6px;
            transition: all 0.15s;
        }
        .top-btn:hover { background: #f0ede8; border-color: #ccc; }
        .top-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: #ff6b00; display: inline-block; }
        .model-dropdown {
            position: absolute; top: calc(100% + 4px); right: 0;
            min-width: 220px; background: #fff; border: 1px solid #e0dcd4;
            border-radius: 12px; padding: 6px;
            z-index: 70; display: none;
            box-shadow: 0 8px 40px rgba(0,0,0,0.06);
        }
        .model-dropdown.show { display: block; }
        .model-opt {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 12px; border-radius: 8px;
            cursor: pointer; transition: background 0.1s;
            font-size: 0.82rem; color: #333;
        }
        .model-opt:hover { background: #f8f7f4; }
        .model-opt.disabled { opacity: 0.3; cursor: default; }
        .model-opt .tag { font-size: 0.55rem; padding: 1px 6px; border-radius: 4px; background: #f0ede8; color: #888; }

        .msgs-wrap { flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding: 0 20px; }
        .msgs-inner { width: 100%; max-width: 768px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 24px 0 8px; }

        .welcome {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; flex: 1; text-align: center; padding-bottom: 12vh;
        }
        .welcome img { width: 48px; height: 48px; border-radius: 50%; margin-bottom: 20px; object-fit: contain; }
        .welcome h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; color: #1f1f1f; }
        .welcome .sub { color: #888; font-size: 0.85rem; margin-top: 4px; }
        .welcome .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 28px; justify-content: center; }
        .welcome .chip {
            padding: 8px 18px; border-radius: 100px;
            border: 1px solid #e0dcd4; background: #fff;
            color: #555; font-size: 0.82rem; cursor: pointer;
            transition: all 0.15s;
        }
        .welcome .chip:hover { border-color: #ff6b00; color: #ff6b00; background: rgba(255,107,0,0.02); }

        .msg { padding: 14px 0; animation: fadeIn 0.2s ease-out; }
        .msg .label { font-size: 0.65rem; font-weight: 600; color: #999; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
        .msg .content { font-size: 0.92rem; line-height: 1.7; color: #2a2a2a; }
        .msg .content pre {
            background: #f8f7f4 !important; border: 1px solid #e0dcd4;
            border-radius: 10px; padding: 14px; margin: 8px 0; overflow-x: auto;
            font-family: 'Courier New', monospace; font-size: 0.82rem;
        }
        .msg .content :not(pre) > code { background: rgba(255,107,0,0.06); color: #ff6b00; padding: 1px 6px; border-radius: 4px; }

        .think { display: flex; align-items: center; gap: 8px; padding: 8px 0; max-width: 768px; margin: 0 auto; width: 100%; color: #999; font-size: 0.82rem; }
        .think span { animation: pulse 1.4s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

        .input-area { padding: 8px 20px 20px; display: flex; justify-content: center; }
        .input-outer {
            width: 100%; max-width: 768px;
            background: #fff; border: 1px solid #e0dcd4;
            border-radius: 16px; padding: 12px 12px 12px 20px;
            display: flex; align-items: flex-end; gap: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.02);
            transition: border-color 0.15s;
        }
        .input-outer:focus-within { border-color: #ff6b00; box-shadow: 0 2px 16px rgba(255,107,0,0.04); }
        .input-box {
            flex: 1; background: transparent; border: none;
            color: #1f1f1f; font-family: inherit; font-size: 0.92rem;
            line-height: 1.5; resize: none; outline: none; max-height: 160px;
        }
        .send-btn {
            width: 38px; height: 38px; border-radius: 50%; border: none;
            background: #ff6b00; color: #fff;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            opacity: 0.2; flex-shrink: 0; transition: opacity 0.15s;
        }
        .send-btn.active { opacity: 1; }
        .send-btn:hover { background: #e86000; }

        .demo-badge {
            position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%);
            background: rgba(255,107,0,0.04); border: 1px solid rgba(255,107,0,0.08);
            color: #ff6b00; padding: 4px 14px; border-radius: 100px;
            font-size: 0.7rem; z-index: 80; display: none;
            backdrop-filter: blur(8px);
        }
        .demo-badge.show { display: flex; align-items: center; gap: 4px; }

        .toast {
            position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%);
            background: rgba(31,31,31,0.85); color: #fff;
            padding: 6px 16px; border-radius: 10px;
            font-size: 0.78rem; z-index: 100;
            opacity: 0; transition: opacity 0.25s; pointer-events: none;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div class="top">
    <div class="top-inner">
        <a href="#" class="brand">
            <img src="glassescat-logo.png" alt="GlassesCat">
            <div>
                <div class="brand-text">GlassesCat</div>
                <div class="brand-sub">by Elythra-AI</div>
            </div>
        </a>
        <div class="top-right">
            <div style="position:relative">
                <button class="top-btn" onclick="toggleModel()"><span class="dot"></span><span id="modelName">X_OPUS</span></button>
                <div id="modelList" class="model-dropdown">
                    <div class="model-opt" onclick="selectModel('X_OPUS')">X_OPUS</div>
                    <div class="model-opt" onclick="selectModel('X_GLITCH_OPUS')">X_GLITCH_OPUS</div>
                    <div class="model-opt" onclick="selectModel('X_FABLE_CODER')">X_FABLE_CODER</div>
                    <div style="height:1px;background:#e0dcd4;margin:4px 8px"></div>
                    <div class="model-opt disabled">ShadowCat R:1 <span class="tag">yak&#305;nda</span></div>
                </div>
            </div>
            <button class="top-btn" onclick="toggleDemo()">&#9678; Demo</button>
        </div>
    </div>
</div>

<div class="msgs-wrap" id="msgsWrap">
    <div id="welcome" class="welcome">
        <img src="glassescat-logo.png" alt="">
        <h1>Merhaba</h1>
        <div class="sub">Size nas&#305;l yard&#305;mc&#305; olabilirim?</div>
        <div class="chips">
            <button class="chip" onclick="sendSug('Bana Python ile dosya okuyucu yaz')">&#9003; Kod yaz</button>
            <button class="chip" onclick="sendSug('Pluginleri listele')">&#9678; Pluginler</button>
            <button class="chip" onclick="sendSug('Sistem durumunu goster')">&#9881; Sistem</button>
            <button class="chip" onclick="sendSug('Merhaba')">&#9998; Merhaba de</button>
        </div>
    </div>
    <div id="msgsInner" class="msgs-inner" style="display:none"></div>
</div>

<div id="think" class="think" style="display:none">
    <span>yan&#305;t haz&#305;rlan&#305;yor...</span>
</div>

<div class="input-area">
    <div class="input-outer">
        <textarea id="inputBox" class="input-box" rows="1" placeholder="Mesaj yaz&#305;n..." oninput="resize(this);updateBtn()" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
        <button id="sendBtn" class="send-btn" onclick="send()" disabled>&#8593;</button>
    </div>
</div>

<div id="demoBadge" class="demo-badge show">&#9678; Demo mod &mdash; yan&#305;tlar sim&uuml;le ediliyor</div>
<div id="toast" class="toast">kopyaland&#305;</div>

<script>
    let chats = {}, chatId = null, busy = false, demoMode = true;

    const DEMO = {
        'kod':'```python\ndef read_file(path):\n    with open(path, \'r\', encoding=\'utf-8\') as f:\n        return f.read()\n\nprint(read_file(\'ornek.txt\'))\n```\n\nBu kadar basit. Dosyay&#305; a&ccedil;, oku, d&ouml;nd&uuml;r.',
        'plugin':'**Aktif Pluginler**\n\n- Qwen Assistant &mdash; aktif\n- Web Scraper &mdash; aktif\n- Code Formatter &mdash; aktif',
        'sistem':'**Sistem Durumu**\n\n- CPU: %23\n- RAM: 8.2 GB / 18 GB\n- 37 ara&ccedil; aktif\n- 31 haf&#305;za dosyas&#305;',
        'python':'```python\ndef fib(n):\n    a, b = 0, 1\n    for _ in range(n):\n        yield a\n        a, b = b, a + b\n\nprint(list(fib(10)))\n```',
        'merhaba':'Merhaba! Size nas&#305;l yard&#305;mc&#305; olabilirim?\n\nKod yazma, dosya i&#351;lemleri, web aramas&#305; veya sistem y&ouml;netimi i&ccedil;in buraday&#305;m.'
    };

    function reply(m) {
        const l = m.toLowerCase();
        for (const [k, v] of Object.entries(DEMO)) if (l.includes(k)) return v;
        return '"**' + m + '**" &uuml;zerine &ccedil;al&#305;&#351;&#305;yorum.\n\nBu bir demo yan&#305;t&#305;d&#305;r.';
    }

    function toggleDemo() { demoMode = !demoMode; document.getElementById('demoBadge').classList.toggle('show', demoMode); toast(demoMode ? 'Demo mod a&ccedil;&#305;k' : 'Canl&#305; mod'); }
    function toggleModel() { document.getElementById('modelList').classList.toggle('show'); }
    function selectModel(id) { document.getElementById('modelName').textContent = id; document.getElementById('modelList').classList.remove('show'); toast(id); }
    function toast(t) { const e = document.getElementById('toast'); e.innerHTML = t; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 1500); }
    function newChat() { chatId = 'c'+Date.now(); chats[chatId] = {msgs:[]}; document.getElementById('welcome').style.display = 'flex'; document.getElementById('msgsInner').style.display = 'none'; document.getElementById('msgsInner').innerHTML = ''; }
    function addMsg(role, text) {
        const inner = document.getElementById('msgsInner');
        document.getElementById('welcome').style.display = 'none';
        inner.style.display = 'flex';
        const el = document.createElement('div'); el.className = 'msg ' + role;
        const lbl = document.createElement('div'); lbl.className = 'label';
        lbl.textContent = role === 'user' ? 'Sen' : 'GlassesCat';
        el.appendChild(lbl);
        const ct = document.createElement('div'); ct.className = 'content';
        if (role === 'ai') ct.innerHTML = format(text);
        else ct.textContent = text;
        el.appendChild(ct); inner.appendChild(el);
        setTimeout(() => document.getElementById('msgsWrap').scrollTop = document.getElementById('msgsWrap').scrollHeight, 20);
    }
    function format(t) { return t.replace(/```(\w+)?\n([\s\S]*?)```/g, (m,l,c) => '<pre><code>'+esc(c.trim())+'</code></pre>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>'); }
    function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function resize(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; }
    function updateBtn() { const v = document.getElementById('inputBox').value.trim(); const b = document.getElementById('sendBtn'); b.disabled = !v || busy; b.classList.toggle('active', v.length > 0); }
    function sendSug(t) { document.getElementById('inputBox').value = t; updateBtn(); send(); }

    async function send() {
        const i = document.getElementById('inputBox'), t = i.value.trim();
        if (!t || busy) return;
        if (!chatId) { chatId = 'c'+Date.now(); chats[chatId] = {msgs:[]}; }
        chats[chatId].msgs.push({role:'user',text:t}); addMsg('user',t);
        i.value = ''; resize(i); updateBtn(); busy = true;
        document.getElementById('think').style.display = 'flex';
        await new Promise(r => setTimeout(r, 600));
        const r = reply(t); chats[chatId].msgs.push({role:'ai',text:r}); addMsg('ai',r);
        busy = false; document.getElementById('think').style.display = 'none'; updateBtn(); i.focus();
    }

    document.addEventListener('click', function(e) {
        const m = document.getElementById('modelList');
        if (m.classList.contains('show') && !e.target.closest('.top-btn') && !e.target.closest('.model-dropdown')) m.classList.remove('show');
    });

    newChat();
</script>
</body>
</html>
