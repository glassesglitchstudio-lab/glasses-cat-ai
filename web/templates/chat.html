<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlassesCat AI — Elythra-AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        ::selection { background: rgba(124,58,237,0.15); }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
            height: 100vh;
            display: flex;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.06); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.1); }

        .sidebar {
            width: 280px; min-width: 280px;
            background: #f0efe8;
            display: flex; flex-direction: column;
            height: 100vh;
            border-right: 1px solid #e0ddd5;
            transition: transform 0.2s;
        }
        @media (max-width:768px){ .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%)} .sidebar.open{transform:translateX(0)} }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #e0ddd5;
        }
        .sidebar-brand {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; margin-bottom: 16px;
        }
        .sidebar-brand img {
            width: 30px; height: 30px; border-radius: 50%; object-fit: contain;
        }
        .sidebar-brand-text {
            font-weight: 700; font-size: 0.95rem; color: #1a1a1a;
            letter-spacing: -0.01em;
        }
        .sidebar-brand-sub {
            font-size: 0.6rem; color: #999;
        }
        .new-chat-btn {
            width: 100%; padding: 10px 14px;
            border-radius: 10px; border: 1px solid #e0ddd5;
            background: #fff; color: #444;
            font-size: 0.85rem; font-weight: 500; font-family: inherit;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
            transition: all 0.15s;
        }
        .new-chat-btn:hover { background: #f5f5f5; border-color: #ccc; }
        .new-chat-btn svg { width: 16px; height: 16px; }

        .sidebar-list { flex: 1; overflow-y: auto; padding: 8px 12px; }
        .chat-item {
            padding: 10px 12px; border-radius: 8px;
            font-size: 0.82rem; color: #555; cursor: pointer;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: all 0.1s;
        }
        .chat-item:hover { background: rgba(124,58,237,0.04); color: #1a1a1a; }
        .chat-item.active { background: rgba(124,58,237,0.08); color: #7c3aed; font-weight: 500; }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid #e0ddd5;
            font-size: 0.72rem; color: #999;
        }

        .main { flex: 1; display: flex; flex-direction: column; height: 100vh; min-width: 0; }

        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 24px;
            border-bottom: 1px solid #e0ddd5;
            background: rgba(245,245,245,0.8);
            backdrop-filter: blur(8px);
            min-height: 56px;
        }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .hamburger {
            display: none; width: 32px; height: 32px;
            align-items: center; justify-content: center;
            border-radius: 6px; border: none; background: transparent;
            color: #666; cursor: pointer; font-size: 1.1rem;
        }
        @media (max-width:768px){ .hamburger{display:flex} }
        .model-selector {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 14px; border-radius: 8px;
            border: 1px solid #e0ddd5; background: #fff;
            cursor: pointer; font-size: 0.82rem; font-weight: 500; color: #444;
            transition: all 0.15s; position: relative;
        }
        .model-selector:hover { border-color: #7c3aed; }
        .model-selector .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #7c3aed; display: inline-block;
        }
        .model-dropdown {
            position: absolute; top: calc(100% + 4px); left: 0;
            min-width: 200px; background: #fff;
            border: 1px solid #e0ddd5; border-radius: 12px;
            padding: 6px; z-index: 70; display: none;
            box-shadow: 0 8px 40px rgba(0,0,0,0.06);
        }
        .model-dropdown.show { display: block; }
        .model-opt {
            padding: 8px 12px; border-radius: 8px;
            cursor: pointer; font-size: 0.82rem; color: #333;
            transition: background 0.1s;
        }
        .model-opt:hover { background: #f5f5f5; }
        .model-opt.active { color: #7c3aed; font-weight: 500; }
        .model-opt .sub {
            display: block; font-size: 0.65rem; color: #999; font-weight: 400;
            margin-top: 1px;
        }
        .model-opt.disabled { opacity: 0.3; cursor: default; }

        .topbar-right { display: flex; align-items: center; gap: 8px; }
        .topbar-btn {
            padding: 6px 14px; border-radius: 8px;
            border: 1px solid #e0ddd5; background: #fff;
            color: #555; cursor: pointer; font-size: 0.78rem; font-family: inherit;
            transition: all 0.15s;
        }
        .topbar-btn:hover { border-color: #ccc; background: #f5f5f5; }

        .msgs-wrap {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column;
        }
        .msgs-inner {
            width: 100%; max-width: 720px;
            margin: 0 auto; flex: 1;
            display: flex; flex-direction: column;
            padding: 24px 24px 8px;
        }

        .welcome {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; flex: 1; text-align: center;
            padding: 0 24px 10vh;
        }
        .welcome-logo {
            width: 56px; height: 56px; border-radius: 50%;
            background: rgba(124,58,237,0.04);
            border: 1px solid rgba(124,58,237,0.08);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; margin-bottom: 24px;
        }
        .welcome-logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
        .welcome h1 {
            font-size: 1.6rem; font-weight: 600;
            letter-spacing: -0.02em; color: #1a1a1a;
        }
        .welcome .sub { color: #888; font-size: 0.9rem; margin-top: 4px; }
        .welcome .chips {
            display: flex; gap: 8px; flex-wrap: wrap;
            margin-top: 32px; justify-content: center;
            max-width: 400px;
        }
        .welcome .chip {
            padding: 8px 20px; border-radius: 100px;
            border: 1px solid #e0ddd5; background: #fff;
            color: #555; font-size: 0.82rem; cursor: pointer;
            transition: all 0.15s; font-family: inherit;
        }
        .welcome .chip:hover { border-color: #7c3aed; color: #7c3aed; }

        .msg { padding: 16px 0; animation: fadeIn 0.2s ease-out; }
        .msg.user { }
        .msg.ai { }
        .msg .header {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 8px;
        }
        .msg .avatar {
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; font-weight: 600; overflow: hidden;
            flex-shrink: 0;
        }
        .msg .avatar img { width: 100%; height: 100%; object-fit: contain; }
        .msg.user .avatar { background: #e0ddd5; color: #555; }
        .msg.ai .avatar { background: rgba(124,58,237,0.08); }
        .msg .name { font-size: 0.82rem; font-weight: 600; color: #333; }
        .msg .content {
            margin-left: 36px;
            font-size: 0.92rem; line-height: 1.7; color: #2a2a2a;
        }
        .msg .content pre {
            background: #f8f8f8 !important;
            border: 1px solid #e0ddd5;
            border-radius: 10px; padding: 14px; margin: 10px 0;
            overflow-x: auto;
        }
        .msg .content pre code { font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; color: #333; }
        .msg .content :not(pre) > code {
            background: rgba(124,58,237,0.06);
            color: #7c3aed; padding: 1px 6px; border-radius: 4px;
        }

        .think {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 0; margin-left: 36px;
            max-width: 720px; color: #999; font-size: 0.85rem;
        }
        .think .pulse { animation: pulse 1.4s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

        .input-area {
            padding: 12px 24px 20px;
            display: flex; justify-content: center;
        }
        .input-outer {
            width: 100%; max-width: 720px;
            background: #fff;
            border: 1px solid #e0ddd5;
            border-radius: 14px;
            padding: 14px 14px 14px 20px;
            display: flex; align-items: flex-end; gap: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.02);
            transition: border-color 0.15s;
        }
        .input-outer:focus-within { border-color: #7c3aed; box-shadow: 0 2px 16px rgba(124,58,237,0.04); }
        .input-box {
            flex: 1; background: transparent; border: none;
            color: #1a1a1a; font-family: inherit; font-size: 0.92rem;
            line-height: 1.5; resize: none; outline: none; max-height: 160px;
        }
        .send-btn {
            width: 36px; height: 36px; border-radius: 50%; border: none;
            background: #7c3aed; color: #fff;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            opacity: 0.15; flex-shrink: 0; transition: all 0.15s;
        }
        .send-btn.active { opacity: 1; }
        .send-btn:hover { background: #6d28d9; }

        .demo-badge {
            position: fixed; bottom: 82px; left: 50%; transform: translateX(-50%);
            background: rgba(124,58,237,0.04); border: 1px solid rgba(124,58,237,0.08);
            color: #7c3aed; padding: 4px 14px; border-radius: 100px;
            font-size: 0.7rem; z-index: 80; display: none;
        }
        .demo-badge.show { display: flex; align-items: center; gap: 4px; }

        .toast {
            position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%);
            background: rgba(26,26,26,0.85); color: #fff;
            padding: 6px 16px; border-radius: 10px;
            font-size: 0.78rem; z-index: 100;
            opacity: 0; transition: opacity 0.25s; pointer-events: none;
        }
        .toast.show { opacity: 1; }

        @media (max-width:768px){ .welcome .chips{flex-direction:column;align-items:stretch} .msg .content{margin-left:0} .think{margin-left:0} }
    </style>
</head>
<body>

<aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <a href="#" class="sidebar-brand">
            <img src="/static/glassescat-logo.png" alt="">
            <div>
                <div class="sidebar-brand-text">GlassesCat</div>
                <div class="sidebar-brand-sub">by Elythra-AI</div>
            </div>
        </a>
        <button class="new-chat-btn" onclick="newChat()">
            <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 2a.75.75 0 0 1 .75.75v4.5h4.5a.75.75 0 0 1 0 1.5h-4.5v4.5a.75.75 0 0 1-1.5 0v-4.5h-4.5a.75.75 0 0 1 0-1.5h4.5v-4.5A.75.75 0 0 1 8 2z"/></svg>
            Yeni Sohbet
        </button>
    </div>
    <div id="chatList" class="sidebar-list"></div>
    <div class="sidebar-footer">GlassesCat &middot; workshop v3.0</div>
</aside>
<div id="sidebarOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:40" onclick="toggleSidebar()"></div>

<div class="main">
    <div class="topbar">
        <div class="topbar-left">
            <button class="hamburger" onclick="toggleSidebar()">&#9776;</button>
            <div class="model-selector" onclick="toggleModel()">
                <span class="dot"></span>
                <span id="modelName">X_OPUS</span>
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="margin-left:2px"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                <div id="modelDropdown" class="model-dropdown">
                    <div class="model-opt active" onclick="selectModel('X_OPUS')">X_OPUS<span class="sub">hibrit &ccedil;ift beyin routing</span></div>
                    <div class="model-opt" onclick="selectModel('X_GLITCH_OPUS')">X_GLITCH_OPUS<span class="sub">glitch optimizasyonlu opus</span></div>
                    <div class="model-opt" onclick="selectModel('X_FABLE_CODER')">X_FABLE_CODER<span class="sub">kod &uuml;retim ve debug</span></div>
                    <div style="height:1px;background:#e0ddd5;margin:4px 8px"></div>
                    <div class="model-opt disabled">ShadowCat R:1<span class="sub">yak&#305;nda</span></div>
                </div>
            </div>
        </div>
        <div class="topbar-right">
            <button class="topbar-btn" onclick="toggleDemo()">&#9678; Demo</button>
        </div>
    </div>

    <div class="msgs-wrap" id="msgsWrap">
        <div id="welcome" class="welcome">
            <div class="welcome-logo"><img src="/static/glassescat-logo.png" alt=""></div>
            <h1>Merhaba</h1>
            <div class="sub">Size nas&#305;l yard&#305;mc&#305; olabilirim?</div>
            <div class="chips">
                <button class="chip" onclick="sendSug('Python ile dosya okuyucu yaz')">Kod yaz</button>
                <button class="chip" onclick="sendSug('Pluginleri listele')">Pluginler</button>
                <button class="chip" onclick="sendSug('Sistem durumunu goster')">Sistem</button>
                <button class="chip" onclick="sendSug('Merhaba')">Merhaba de</button>
            </div>
        </div>
        <div id="msgsInner" class="msgs-inner" style="display:none"></div>
    </div>

    <div id="think" class="think" style="display:none">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="pulse"><circle cx="8" cy="8" r="6" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="28" stroke-dashoffset="10"/></svg>
        <span class="pulse">yan&#305;t haz&#305;rlan&#305;yor...</span>
    </div>

    <div class="input-area">
        <div class="input-outer">
            <textarea id="inputBox" class="input-box" rows="1" placeholder="Mesaj yaz&#305;n..." oninput="resize(this);updateBtn()" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
            <button id="sendBtn" class="send-btn" onclick="send()" disabled>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2.5 2.5L13.5 8L2.5 13.5V9.5L9.5 8L2.5 6.5V2.5Z"/></svg>
            </button>
        </div>
    </div>
</div>

<div id="demoBadge" class="demo-badge show">&#9678; Demo mod</div>
<div id="toast" class="toast">kopyaland&#305;</div>

<script>
    let chats = {}, chatId = null, busy = false, demoMode = true;

    const DEMO = {
        'kod':'```python\ndef read_file(path):\n    with open(path, \'r\', encoding=\'utf-8\') as f:\n        return f.read()\n\nprint(read_file(\'ornek.txt\'))\n```\n\nBu fonksiyon dosyay&#305; a&ccedil;ar, okur ve i&ccedil;eri&#287;i d&ouml;nd&uuml;r&uuml;r.',
        'plugin':'**Aktif Pluginler**\n\n- Qwen Assistant &mdash; aktif\n- Web Scraper &mdash; aktif\n- Code Formatter &mdash; aktif\n- Security Analyst &mdash; pasif',
        'sistem':'**Sistem Durumu**\n\n- CPU: %23\n- RAM: 8.2 GB / 18 GB\n- 37 ara&ccedil; aktif\n- 31 haf&#305;za dosyas&#305;\n- Model: X_OPUS',
        'python':'```python\ndef fib(n):\n    a, b = 0, 1\n    for _ in range(n):\n        yield a\n        a, b = b, a + b\n\nprint(list(fib(10)))\n```',
        'merhaba':'Merhaba! Size nas&#305;l yard&#305;mc&#305; olabilirim? Kod yazma, dosya i&#351;lemleri, web aramas&#305; veya sistem y&ouml;netimi i&ccedil;in buraday&#305;m.'
    };

    function reply(m) {
        const l = m.toLowerCase();
        for (const [k, v] of Object.entries(DEMO)) if (l.includes(k)) return v;
        return '"**' + m + '**" &uuml;zerine &ccedil;al&#305;&#351;&#305;yorum.\n\nBu bir demo yan&#305;t&#305;d&#305;r. Ger&ccedil;ek AI yan&#305;t&#305; i&ccedil;in backend ba&#287;lant&#305;s&#305; gereklidir.';
    }

    function toggleDemo() { demoMode = !demoMode; document.getElementById('demoBadge').classList.toggle('show', demoMode); toast(demoMode ? 'Demo mod' : 'Canl&#305; mod'); }
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').style.display = document.getElementById('sidebar').classList.contains('open') ? 'block' : 'none'; }
    function toggleModel() { document.getElementById('modelDropdown').classList.toggle('show'); }
    function selectModel(id) { document.getElementById('modelName').textContent = id.replace('_', ' '); document.getElementById('modelDropdown').classList.remove('show'); toast(id); }
    function toast(t) { const e = document.getElementById('toast'); e.innerHTML = t; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 1500); }

    function newChat() {
        chatId = 'c' + Date.now();
        chats[chatId] = { msgs: [], title: 'Yeni Sohbet' };
        renderList();
        showWelcome();
        if (window.innerWidth < 768) toggleSidebar();
    }

    function renderList() {
        const el = document.getElementById('chatList');
        el.innerHTML = '';
        Object.entries(chats).forEach(([id, c]) => {
            const d = document.createElement('div');
            d.className = 'chat-item' + (id === chatId ? ' active' : '');
            d.textContent = c.title;
            d.onclick = () => switchChat(id);
            el.appendChild(d);
        });
    }

    function switchChat(id) {
        chatId = id;
        renderList();
        const c = chats[id];
        document.getElementById('welcome').style.display = 'none';
        const i = document.getElementById('msgsInner');
        i.style.display = 'flex';
        i.innerHTML = '';
        c.msgs.forEach(m => addMsg(m.role, m.text, false));
        scrollBottom();
    }

    function showWelcome() {
        document.getElementById('welcome').style.display = 'flex';
        document.getElementById('msgsInner').style.display = 'none';
        document.getElementById('msgsInner').innerHTML = '';
    }

    function addMsg(role, text) {
        const inner = document.getElementById('msgsInner');
        document.getElementById('welcome').style.display = 'none';
        inner.style.display = 'flex';
        const el = document.createElement('div');
        el.className = 'msg ' + role;
        const hdr = document.createElement('div');
        hdr.className = 'header';
        const av = document.createElement('div');
        av.className = 'avatar';
        if (role === 'user') {
            av.textContent = 'S';
        } else {
            av.innerHTML = '<img src="/static/glassescat-logo.png" alt="">';
        }
        hdr.appendChild(av);
        const nm = document.createElement('span');
        nm.className = 'name';
        nm.textContent = role === 'user' ? 'Sen' : 'GlassesCat';
        hdr.appendChild(nm);
        el.appendChild(hdr);
        const ct = document.createElement('div');
        ct.className = 'content';
        if (role === 'ai') {
            ct.innerHTML = format(text);
            ct.querySelectorAll('pre code').forEach(b => hljs && hljs.highlightElement(b));
        } else ct.textContent = text;
        el.appendChild(ct);
        inner.appendChild(el);
        scrollBottom();
    }

    function format(t) {
        return t.replace(/```(\w+)?\n([\s\S]*?)```/g, (m, l, c) => '<pre><code class="language-' + (l || '') + '">' + esc(c.trim()) + '</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\n/g, '<br>');
    }

    function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function scrollBottom() { setTimeout(() => document.getElementById('msgsWrap').scrollTop = document.getElementById('msgsWrap').scrollHeight, 20); }
    function resize(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; }
    function updateBtn() { const v = document.getElementById('inputBox').value.trim(); const b = document.getElementById('sendBtn'); b.disabled = !v || busy; b.classList.toggle('active', v.length > 0); }
    function sendSug(t) { document.getElementById('inputBox').value = t; updateBtn(); send(); }

    async function send() {
        const i = document.getElementById('inputBox'), t = i.value.trim();
        if (!t || busy) return;
        if (!chatId) { chatId = 'c' + Date.now(); chats[chatId] = { msgs: [], title: t.slice(0, 30) }; renderList(); }
        chats[chatId].msgs.push({ role: 'user', text: t });
        addMsg('user', t);
        i.value = ''; resize(i); updateBtn(); busy = true;
        document.getElementById('think').style.display = 'flex';
        await new Promise(r => setTimeout(r, 600));
        const r = reply(t);
        chats[chatId].msgs.push({ role: 'ai', text: r });
        addMsg('ai', r);
        renderList();
        busy = false; document.getElementById('think').style.display = 'none'; updateBtn(); i.focus();
    }

    document.addEventListener('click', function(e) {
        const dd = document.getElementById('modelDropdown');
        if (dd.classList.contains('show') && !e.target.closest('.model-selector')) dd.classList.remove('show');
    });

    newChat();
</script>
</body>
</html>
